name: Build Mati (Spotpear 1.28 BOX)

on:
  workflow_dispatch:
  push:
    branches:
      - mati-alive

permissions:
  contents: write

jobs:
  build:
    name: Mati - wake word ${{ matrix.wake }}
    strategy:
      fail-fast: false
      matrix:
        wake: [custom, hiesp]
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          python scripts/build.py spotpear/sp-esp32-s3-1.28-box \
            --name sp-esp32-s3-1.28-box --language pl-PL --wake-word ${{ matrix.wake }} 2>&1 | tee build.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Collect binaries
        shell: bash
        run: |
          mkdir -p out
          cp build/merged-binary.bin out/mati_full_0x0.bin
          cp build/xiaozhi.bin out/mati_app.bin
          cp build/generated_assets.bin out/mati_assets.bin || true
          cp build/partition_table/partition-table.bin out/ || true
          cp build/bootloader/bootloader.bin out/ || true
          cp build/ota_data_initial.bin out/ || true
          grep -iE "wake_word:|language:|multinet|wakenet|Generated|emoji|warning" build.log | head -200 > out/build_summary.txt || true
          cp build/assets/index.json out/ 2>/dev/null || find build -name index.json -path "*assets*" -exec cp {} out/ \; || true
          ls -la out

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: mati_${{ matrix.wake }}
          path: out/
          if-no-files-found: error

      - name: Publish binaries to branch mati-bin
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          for i in 1 2 3 4 5; do
            rm -rf pub && git clone --depth 1 --branch mati-bin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" pub 2>/dev/null \
              || (mkdir pub && cd pub && git init -q -b mati-bin && git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}")
            rm -rf pub/${{ matrix.wake }} && mkdir -p pub/${{ matrix.wake }} && cp out/* pub/${{ matrix.wake }}/
            cd pub && git add -A && git commit -q -m "bin ${{ matrix.wake }} ${{ github.sha }}" && git push origin mati-bin && exit 0
            cd .. ; sleep $((RANDOM % 10 + 5))
          done
          exit 1
